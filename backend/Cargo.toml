[package]
name = "notes-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
jsonwebtoken = "9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "notes_backend"
path = "src/lib.rs"

[[bin]]
name = "notes-backend"
path = "src/main.rs"
